<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Lunx Alpine Todos</title>
</head>
<body style="margin:0;background:#0f172a;color:#f1f5f9;font-family:system-ui">
  <div id="root" x-data="{
    items: [{id:1, text:'Ship production build', done:true}, {id:2, text:'Verify module federation', done:false}],
    draft: '',
    add() { if (!this.draft.trim()) return; this.items.push({id: Date.now(), text: this.draft.trim(), done: false}); this.draft=''; },
    remaining() { return this.items.filter(i => !i.done).length }
  }" style="max-width:640px;margin:40px auto;padding:0 24px">
    <h1>Alpine Todos</h1>
    <p x-text="remaining() + ' remaining'"></p>
    <form @submit.prevent="add()" style="display:flex;gap:8px;margin:16px 0">
      <input x-model="draft" placeholder="Add a task" style="flex:1;padding:10px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#fff"/>
      <button style="padding:10px 16px;background:#6366f1;color:#fff;border:none;border-radius:8px">Add</button>
    </form>
    <template x-for="item in items" :key="item.id">
      <label style="display:flex;gap:12px;align-items:center;background:#1e293b;padding:12px;border-radius:8px;margin-bottom:8px">
        <input type="checkbox" x-model="item.done"/>
        <span x-text="item.text" :style="item.done ? 'text-decoration:line-through;color:#94a3b8' : ''"></span>
      </label>
    </template>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
